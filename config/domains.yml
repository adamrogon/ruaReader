# Sending domains under monitoring.
#
# `dkim_selectors` must be listed explicitly — a DKIM record can only be looked
# up as <selector>._domainkey.<domain>, and selectors cannot be discovered from
# DNS. Get them from your sending platform's DNS setup screen.
#
# This file only seeds the database when it is completely empty (first run).
# Once you have real domains, manage them from the Settings page in the
# dashboard instead — editing this file afterwards has no effect.

defaults:
  # Applied to every domain unless overridden in the entry itself.
  dkim_selectors:
    - google        # Google Workspace default
    - selector1     # Microsoft 365 default pair
    - selector2

domains: []
